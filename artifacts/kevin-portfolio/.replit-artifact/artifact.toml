kind = "web"
previewPath = "/"
title = "Kevin's Portfolio"
version = "1.0.0"
id = "artifacts/kevin-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20676

[services.development]
run = "pnpm --filter @workspace/kevin-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kevin-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/kevin-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20676"
BASE_PATH = "/"
