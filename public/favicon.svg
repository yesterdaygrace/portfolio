<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3344"/>
      <stop offset="100%" stop-color="#1B1F2A"/>
    </linearGradient>

    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F7F1E2"/>
    </linearGradient>

    <linearGradient id="terraArm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8A08A"/>
      <stop offset="100%" stop-color="#F7D2C2"/>
    </linearGradient>

    <linearGradient id="terraLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8A08A"/>
      <stop offset="100%" stop-color="#A8614E"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F1E2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F7F1E2" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#borderGrad)" stroke-width="1.25"/>

  <!-- Vertical Stem (Warm Ivory) -->
  <rect x="14" y="15" width="7.5" height="34" rx="2" fill="url(#ivoryGrad)"/>

  <!-- Upper Diagonal Arm (Warm Terracotta Highlight) -->
  <path d="M 25.5 32 L 42 15.5 H 50.5 L 32 32 Z" fill="url(#terraArm)"/>

  <!-- Lower Diagonal Leg (Terracotta Accent with Depth) -->
  <path d="M 25.5 32 L 32 32 L 50.5 48.5 H 42 Z" fill="url(#terraLeg)"/>

  <!-- Architectural Seam Highlight -->
  <line x1="25.5" y1="32" x2="32" y2="32" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="0.75" stroke-linecap="round"/>
</svg>
